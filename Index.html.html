<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FortibeX – Coming soon</title>
  <meta name="description" content="FortibeX – Strong Currency Solutions. Our website is coming soon.">
  <meta name="theme-color" content="#f4f8f9">

  <meta property="og:type" content="website">
  <meta property="og:title" content="FortibeX – Strong Currency Solutions">
  <meta property="og:description" content="Our website is coming soon.">
  <meta property="og:image" content="https://www.fortibex.com/logo.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #244064;
      --navy-deep: #1a2f4b;
      --teal: #3d9a9a;
      --teal-soft: #d9ecec;
      --paper: #f4f8f9;
      --ink-soft: #4d6079;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--navy);
      font-family: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Geometrische facetten, geïnspireerd op de veelhoeken in het logo */
    .facets {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(2.5rem, env(safe-area-inset-top)) 1.5rem max(2.5rem, env(safe-area-inset-bottom));
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 34rem;
    }

    .logo {
      display: block;
      width: min(22rem, 72vw);
      height: auto;
      animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both;
    }

    h1 {
      margin: clamp(2rem, 6vh, 3.5rem) 0 0;
      font-size: clamp(2rem, 6.5vw, 3.25rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    p {
      margin: 1.1rem 0 0;
      max-width: 30rem;
      font-size: clamp(1.05rem, 2.6vw, 1.2rem);
      font-weight: 300;
      color: var(--ink-soft);
    }

    .contact {
      margin-top: 2.25rem;
      display: inline-block;
      padding: 0.85rem 1.75rem;
      background: var(--navy);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 999px;
      transition: background-color .2s ease;
    }

    .contact:hover { background: var(--navy-deep); }

    .contact:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 3px;
    }

    footer {
      margin-top: clamp(2.5rem, 8vh, 4.5rem);
      font-size: 0.875rem;
      color: var(--ink-soft);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
      .contact { transition: none; }
    }
  </style>
</head>
<body>

  <svg class="facets" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <!-- linksboven -->
    <polygon points="0,0 520,0 0,360"        fill="#d9ecec" opacity=".75"/>
    <polygon points="0,0 300,0 0,190"        fill="#3d9a9a" opacity=".18"/>
    <polygon points="300,0 520,0 0,360"      fill="#244064" opacity=".05"/>
    <!-- rechtsonder -->
    <polygon points="1440,900 1440,470 880,900" fill="#d9ecec" opacity=".75"/>
    <polygon points="1440,900 1440,650 1130,900" fill="#244064" opacity=".10"/>
    <polygon points="1440,470 1440,650 1130,900 880,900" fill="#3d9a9a" opacity=".10"/>
  </svg>

  <div class="page">
    <main>
      <img class="logo" src="logo.png" width="584" height="462"
           alt="FortibeX – Strong Currency Solutions">

      <h1>Coming soon</h1>
      <p>We’re working on our new website. Have a question in the meantime? Feel free to send us an email.</p>

      <a class="contact" href="mailto:yoran.deneef@fortibex.com">Contact us</a>
    </main>

    <footer>© 2026 FortibeX</footer>
  </div>

</body>
</html>
